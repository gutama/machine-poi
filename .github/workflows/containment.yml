name: Containment tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c ci-constraints.txt ruff
      - run: ruff check .
  guardian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No research extras: the guardian must install and run without ML packages.
      - run: python -m pip install -c ci-constraints.txt -e ".[test]"
      - run: python -m pytest tests/guardian --confcutdir=tests/guardian -q
      - name: Verify algebra and synthetic transport controls
        run: python experiments/geometry_sanity.py
      - run: python -m examples.guarded_agent.process_demo
      - run: python -m evals.rogue_agent.run --output containment-eval-report.json
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: containment-eval-report
          path: containment-eval-report.json
  runtime:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c ci-constraints.txt -e ".[research,graph,test]"
      - run: python -m pytest -q -m 'not slow and not integration'
